<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb" id="themeMeta">
  <meta name="description" content="모바일과 PC에서 즐기는 스도쿠">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>스도쿠</title>
</head>
<body>
<main class="app">
  <header><div><h1>스도쿠</h1><p>집중력을 깨우는 숫자 퍼즐</p></div>
    <button id="themeToggle" class="theme-toggle"><span id="themeSwatch"></span>색상</button>
  </header>
  <section class="card">
    <div id="themePanel" class="theme-panel"></div>
    <div class="controls">
      <select id="difficulty"><option value="easy">쉬움</option><option value="medium" selected>보통</option><option value="hard">어려움</option></select>
      <button id="newGame" class="primary">새 게임</button>
      <button id="pause">일시정지</button>
    </div>
    <div class="stats">
      <div><small>난이도</small><strong id="difficultyLabel">보통</strong></div>
      <div><small>실수</small><strong id="mistakes">0 / 3</strong></div>
      <div><small>시간</small><strong id="timer">00:00</strong></div>
    </div>
    <div class="board-wrap"><div id="board" class="board"></div><div id="pauseOverlay" class="pause-overlay hidden">일시정지</div></div>
    <div class="tools">
      <button id="undo">↶ 되돌리기</button><button id="erase">⌫ 지우기</button><button id="notes">✎ 메모</button><button id="hint">💡 힌트</button>
    </div>
    <div id="numberPad" class="number-pad"></div>
    <p id="message" class="message"></p>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton" class="primary">새 게임 시작</button></div></div>
<script src="app.js"></script>
</body></html>
