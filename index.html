<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb" id="themeMeta">
  <meta name="description" content="모바일과 PC에서 즐기는 레벨·통계 기반 스도쿠 웹게임">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스도쿠">
  <link rel="stylesheet" href="style.css">
  <title>스도쿠</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <button id="homeButton" class="brand"><span class="brand-mark">9</span><span><strong>스도쿠</strong><small>집중력을 깨우는 숫자 퍼즐</small></span></button>
    <button id="themeToggle" class="theme-toggle"><span id="themeSwatch"></span>색상</button>
  </header>
  <section id="themePanel" class="theme-panel card hidden"></section>

  <section id="homeScreen" class="screen">
    <div class="hero card">
      <div><small>PLAYER LEVEL</small><div class="level">Lv. <strong id="homeLevel">1</strong></div><p id="homeXpText">0 XP</p></div>
      <div class="streak"><small>현재 연승</small><strong id="homeStreak">0</strong><span>연승</span></div>
      <div class="xpbar"><span id="homeXpBar"></span></div>
    </div>
    <div class="card">
      <h2>난이도 선택</h2>
      <div id="difficultyGrid" class="difficulty-grid"></div>
      <button id="continueGame" class="primary wide hidden">이어하기</button>
      <button id="startGame" class="secondary wide">새 게임</button>
    </div>
    <div class="home-actions">
      <button id="openStats" class="card"><small>STATISTICS</small><strong>통계 보기</strong></button>
      <button id="openHelp" class="card"><small>GUIDE</small><strong>게임 설명</strong></button>
    </div>
  </section>

  <section id="gameScreen" class="screen hidden" hidden>
    <div class="game-head card">
      <button id="backHome">← 메인</button>
      <div><small>난이도</small><strong id="difficultyLabel">보통</strong></div>
      <div><small>실수</small><strong id="mistakes">0 / 3</strong></div>
      <div><small>시간</small><strong id="timer">00:00</strong></div>
      <div><small>힌트</small><strong id="hintCount">0</strong></div>
    </div>
    <div class="card board-card">
      <div class="board-wrap"><div id="board" class="board"></div><div id="pauseOverlay" class="pause-overlay hidden"><strong>일시정지</strong><button id="resumeGame" class="primary">계속하기</button></div></div>
      <p id="message" class="message"></p>
      <div class="tools">
        <button id="undo">↶<small>되돌리기</small></button><button id="erase">⌫<small>지우기</small></button>
        <button id="notes">✎<small>메모</small></button><button id="pause">Ⅱ<small>일시정지</small></button>
        <button id="hint">💡<small>힌트</small></button>
      </div>
      <div id="numberPad" class="number-pad"></div>
    </div>
  </section>

  <section id="statsScreen" class="screen hidden" hidden>
    <div class="screen-title"><button id="statsBack">← 메인</button><h2>플레이 통계</h2></div>
    <div class="hero card compact"><div><small>LEVEL</small><div class="level">Lv. <strong id="statsLevel">1</strong></div></div><div><small>누적 XP</small><strong id="statsXp">0</strong></div><div><small>현재 / 최고 연승</small><strong id="statsStreak">0 / 0</strong></div></div>
    <div id="statsGrid" class="stats-grid"></div>
    <button id="resetStats" class="danger wide">통계 초기화</button>
  </section>

  <section id="resultScreen" class="screen hidden" hidden>
    <div class="card result-card"><small id="resultEyebrow">RESULT</small><h2 id="resultTitle"></h2><p id="resultSubtitle"></p><div id="resultGrid" class="result-grid"></div>
    <button id="resultHome" class="primary wide">메인으로</button><button id="resultAgain" class="secondary wide">같은 난이도로 다시하기</button></div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><div id="modalText"></div><div id="modalActions" class="modal-actions"></div></div></div>
<script src="app.js"></script>
</body></html>
